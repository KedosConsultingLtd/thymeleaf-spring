name: Build, Test, and Deploy

on:
  push:
    branches:
      - 'master'
      - '*-master'
      - 'main'
  pull_request:
    branches:
      - 'master'
      - '*-master'
      - 'main'

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Build thymeleaf-spring5
        working-directory: ./thymeleaf-spring5
        run: mvn clean package -DskipTests=false

      - name: Build thymeleaf-spring6
        working-directory: ./thymeleaf-spring6
        run: mvn clean package -DskipTests=false

      - name: Run tests for thymeleaf-spring5
        working-directory: ./thymeleaf-spring5
        run: mvn test

      - name: Run tests for thymeleaf-spring6
        working-directory: ./thymeleaf-spring6
        run: mvn test

      - name: Upload build artifacts
        uses: actions/upload-artifact@v4
        with:
          name: build-artifacts
          path: |
            thymeleaf-spring5/target/*.jar
            thymeleaf-spring6/target/*.jar
          retention-days: 7

  deploy:
    needs: build-and-test
    runs-on: ubuntu-latest
    # Only deploy on push to master branches (not on PRs)
    if: |
      github.event_name == 'push' &&
      (github.ref == 'refs/heads/master' ||
       github.ref == 'refs/heads/main' ||
       endsWith(github.ref, '-master'))

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: 'maven'

      - name: Configure Maven settings
        run: |
          mkdir -p ~/.m2
          cat > ~/.m2/settings.xml <<EOF
          <settings xmlns="http://maven.apache.org/SETTINGS/1.0.0"
                    xmlns:xsi="http://www.w3.org/2001/XMLSchema-instance"
                    xsi:schemaLocation="http://maven.apache.org/SETTINGS/1.0.0
                                        http://maven.apache.org/xsd/settings-1.0.0.xsd">
            <servers>
              <server>
                <id>kedos-maven</id>
                <configuration>
                  <httpHeaders>
                    <property>
                      <name>Deploy-Token</name>
                      <value>\${env.GITLAB_DEPLOY_TOKEN}</value>
                    </property>
                  </httpHeaders>
                </configuration>
              </server>
            </servers>
          </settings>
          EOF
        env:
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Deploy thymeleaf-spring5 to GitLab Maven Registry
        working-directory: ./thymeleaf-spring5
        run: mvn deploy -DskipTests=true
        env:
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}

      - name: Deploy thymeleaf-spring6 to GitLab Maven Registry
        working-directory: ./thymeleaf-spring6
        run: mvn deploy -DskipTests=true
        env:
          GITLAB_DEPLOY_TOKEN: ${{ secrets.GITLAB_DEPLOY_TOKEN }}
