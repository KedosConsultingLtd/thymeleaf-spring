# Publishes a Kedos build of thymeleaf + thymeleaf-spring6 to GitHub Packages.
#
# Trigger: push a tag named kedos-<version>, e.g. kedos-3.1.6.KEDOS-1 (published as version 3.1.6.KEDOS-1).
# The committed POMs keep the upstream version (3.1.6.RELEASE) so upstream merges stay clean; the Kedos version is
# applied at build time. Upstream's own release path (central-publishing-maven-plugin, GPG signing) is never used:
# artifacts are installed locally and then pushed with deploy:deploy-file to GitHub Packages only.
#
# Consumers: see docs/kedos/publishing.md.

name: kedos-publish

on:
  push:
    tags:
      - 'kedos-*'

permissions:
  contents: read
  packages: write

concurrency:
  group: kedos-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      REPOSITORY_URL: https://maven.pkg.github.com/${{ github.repository }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
          cache: maven
          server-id: github
          server-username: GITHUB_ACTOR
          server-password: GITHUB_TOKEN

      - name: Resolve version from tag
        id: version
        run: |
          VERSION="${GITHUB_REF_NAME#kedos-}"
          if ! echo "$VERSION" | grep -Eq '^[0-9]+\.[0-9]+\.[0-9]+\.KEDOS-[0-9]+$'; then
            echo "Tag must look like kedos-3.1.6.KEDOS-1 (got $GITHUB_REF_NAME)" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Set Kedos version
        run: mvn -B -ntp versions:set -DnewVersion=${{ steps.version.outputs.version }} -DgenerateBackupPoms=false -DprocessAllModules=true

      - name: Build and test (core + Spring 6 suites)
        run: >
          mvn -B -ntp install -Dgpg.skip
          -pl lib/thymeleaf,lib/thymeleaf-spring6,lib/testing/thymeleaf-testing,lib/testing/thymeleaf-testing-spring6,tests/thymeleaf-tests-core,tests/thymeleaf-tests-spring6
          -am

      - name: Test with static-run coalescing forced on
        run: >
          mvn -B -ntp test -Dgpg.skip
          -Dthymeleaf.testing.additionalDialects=org.thymeleaf.parsefilter.StaticRunCoalescingDialect
          -pl tests/thymeleaf-tests-core,tests/thymeleaf-tests-spring6

      - name: Publish to GitHub Packages
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          WORK="$(mktemp -d)"   # run deploy-file outside the reactor so no project configuration applies
          deploy() {
            (cd "$WORK" && mvn -B -ntp org.apache.maven.plugins:maven-deploy-plugin:3.1.4:deploy-file \
              -DrepositoryId=github -Durl="$REPOSITORY_URL" "$@")
          }
          ROOT="$GITHUB_WORKSPACE"
          deploy -Dfile="$ROOT/pom.xml" -DpomFile="$ROOT/pom.xml"
          deploy -Dfile="$ROOT/lib/pom.xml" -DpomFile="$ROOT/lib/pom.xml"
          for MODULE in thymeleaf thymeleaf-spring6; do
            DIR="$ROOT/lib/$MODULE"
            deploy -Dfile="$DIR/target/$MODULE-$VERSION.jar" -DpomFile="$DIR/pom.xml" \
              -Dsources="$DIR/target/$MODULE-$VERSION-sources.jar" \
              -Djavadoc="$DIR/target/$MODULE-$VERSION-javadoc.jar"
          done
